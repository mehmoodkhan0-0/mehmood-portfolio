<!DOCTYPE html>
<!-- Custom 404.
     Lives in public/, so it is copied verbatim to the dist root as 404.html
     with no build step touching it. That is also why everything here is
     inlined: a 404 must never be slower than the page that failed to load, so
     there is no stylesheet import, no Google Fonts request and no JavaScript.
     The only network cost beyond the document is one preloaded, self-hosted
     Syncopate cut for the masthead; body copy uses a system stack.
     Tokens below are inlined copies of the real ones in src/style.css. -->
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050507">
<title>404 / Mehmood Lodhi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050507'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='27' fill='%23d8ba7c' text-anchor='middle'%3EML%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/fonts/syncopate-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:'Syncopate';
    font-style:normal; font-weight:700; font-display:swap;
    src:url('/fonts/syncopate-700.woff2') format('woff2');
  }
  :root{
    --bg:#050507;
    --text:#f4f1e8;
    --text2:#b3ab99;
    --gold:#c9a962;
    --champagne:#d8ba7c;
    --gold-bright:#f0e2b6;
    --line:rgba(216,186,124,.16);
    --r-pill:999px;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --glow-danger:0 18px 50px rgba(230,57,80,.40);
    --font-display:'Syncopate','Arial Black',Impact,sans-serif;
    /* system stack on purpose: not worth a webfont request on an error page */
    --font-sans:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{margin:0; padding:0; box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:grid; place-items:center;
    padding:8vh 6vw; text-align:center;
    /* the same quiet ember ground the main page sits on, painted once */
    background-image:
      radial-gradient(70% 46% at 50% 38%, rgba(255,122,40,.05), transparent 68%),
      radial-gradient(58% 40% at 78% 72%, rgba(216,186,124,.04), transparent 70%);
  }
  ::selection{background:var(--gold); color:#0a0806}
  .eyebrow{
    font-size:.68rem; font-weight:600; letter-spacing:.38em; text-transform:uppercase;
    color:var(--text2); margin-bottom:clamp(24px,4vh,40px);
  }
  .code{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(3.4rem,14vw,9rem); line-height:1; letter-spacing:.02em;
    /* static gilded fill, no shimmer loop: restraint, and it is an error page */
    background:linear-gradient(270deg,#8a6c35,#e8d2a0,#faf3e0,#c9a962,#8a6c35);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .rule{
    width:min(320px,60vw); height:1px; background:var(--line);
    margin:clamp(28px,5vh,48px) auto;
  }
  .lede{
    font-size:clamp(1.05rem,2.4vw,1.4rem); font-weight:300; line-height:1.5;
    color:var(--text); text-wrap:balance;
  }
  .sub{
    margin-top:14px; color:var(--text2); font-size:.95rem; line-height:1.8;
    max-width:44ch; margin-left:auto; margin-right:auto; text-wrap:pretty;
  }
  .btn{
    display:inline-flex; align-items:center; gap:14px;
    margin-top:clamp(32px,6vh,56px);
    padding:18px 38px; border-radius:var(--r-pill);
    border:1px solid rgba(216,186,124,.45);
    background:rgba(244,231,195,.05);
    color:#fff; text-decoration:none;
    font-size:.78rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    transition:border-color .4s var(--ease-out), box-shadow .4s var(--ease-out),
               background .4s var(--ease-out), transform .3s var(--ease-out);
  }
  .btn:hover{
    border-color:var(--gold-bright); background:rgba(201,169,98,.16);
    box-shadow:0 18px 50px rgba(216,186,124,.40);
  }
  .btn:active{transform:scale(.965)}
  .btn .arr{transition:transform .4s var(--ease-out)}
  .btn:hover .arr{transform:translateX(6px)}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1 class="code">404</h1>
    <div class="rule"></div>
    <p class="lede">This route does not resolve.</p>
    <p class="sub">The page you asked for is not on this host. Everything else is still where you left it.</p>
    <a class="btn" href="/">Return to base <span class="arr" aria-hidden="true">&#8594;</span></a>
  </main>
</body>
</html>
